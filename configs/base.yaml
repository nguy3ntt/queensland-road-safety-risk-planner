config_version: 1

project:
  name: queensland-road-segment-crash-risk
  timezone: Australia/Brisbane
  random_seed: 20260925

paths:
  data_root: data
  reports_root: reports/generated
  artifacts_root: artifacts

study:
  geography: Queensland
  spatial_unit: road_segment
  primary_population: state_controlled_roads_with_verified_exposure
  secondary_population: all_other_roads_audit_only
  cadence: quarterly
  forecast_horizon_periods: 1
  primary_outcome: serious_crash_weighted_count
  serious_severities:
    - fatal
    - hospitalisation
  recent_label_buffer_months: 12

segmentation:
  strategy: qrt_official_segment_with_junction_allocation
  target_length_m: null
  geometry_crs: EPSG:7844
  projected_crs: EPSG:9473
  distance_crs_policy: zone_appropriate_gda2020_mga

map_matching:
  initial_search_radius_m: 40
  ambiguity_margin_m: 5
  intersection_policy: retain_ambiguous_junction_candidates
  require_quality_report: true

exposure:
  preferred_measure: vehicle_kilometres_travelled
  allow_imputation: false
  missing_policy: separate_evaluation_tier

panel:
  network_version: qrt_state_controlled_2026_09_26
  source_snapshot_date: 2026-09-26
  first_cutoff_date: 2019-12-31
  last_cutoff_date: 2024-03-31
  label_complete_through: 2024-06-30
  crash_availability_lag_months: 12
  traffic_release_month: 5
  traffic_release_day: 31
  traffic_availability_basis: publisher_schedule_april_may
  lookback_quarters:
    - 4
    - 8
    - 20
  endpoint_snap_tolerance_m: 1.0
  traffic_match_radius_m: 50.0
  geometry_history_status: retrospective_current_snapshot

evaluation:
  primary_scheme: rolling_origin
  geographic_holdout: true
  calibration_window_periods: 4
  ranking_budgets:
    - 50
    - 100
    - 250
    - 0.01
    - 0.05
  primary_metric: serious_crash_recall_at_budget

baselines:
  run_version: baselines_v1_2026_09_26
  target_column: serious_crash_weight_next_1q
  exposure_column: exposure_proxy_vkt_next_1q
  minimum_training_periods: 2
  test_window_periods: 4
  geographic_holdout_field: lga_name_left
  geographic_holdout_value: Brisbane City
  interval_coverage: 0.90
  bootstrap_replicates: 1000
  selection_budget_fraction: 0.01
  poisson_alpha: 0.0001
  poisson_max_iter: 300
  boosted_learning_rate: 0.05
  boosted_max_iter: 120
  boosted_max_leaf_nodes: 15
  boosted_min_samples_leaf: 100
  boosted_l2_regularization: 1.0

graph_models:
  run_version: graph_models_v1_2026_09_26
  adjacency_method: shared_endpoint_one_hop_mean
  graph_feature_columns:
    - temporal_recent_weight_rate
    - temporal_middle_weight_rate
    - temporal_older_weight_rate
    - temporal_recent_event_rate
    - temporal_middle_event_rate
    - temporal_older_event_rate
    - log_length_m
    - log_aadt
    - log_exposure
    - aadt_age_years
  boosted_learning_rate: 0.05
  boosted_max_iter: 120
  boosted_max_leaf_nodes: 15
  boosted_min_samples_leaf: 100
  boosted_l2_regularization: 1.0
  neural_hidden_layer_sizes:
    - 16
    - 8
  neural_alpha: 0.001
  neural_learning_rate_init: 0.001
  neural_batch_size: 4096
  neural_max_iter: 30
  neural_n_iter_no_change: 5
  promotion_min_absolute_gain: 0.0025
  promotion_max_brier_relative_degradation: 0.02
  promotion_max_interval_coverage_drop: 0.02

guardrails:
  causal_claims_allowed: false
  intervention_recommendations_allowed: false
  random_split_as_headline_allowed: false
  raw_data_in_git_allowed: false
