[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qld-road-safety"
version = "0.1.0"
description = "Queensland road-segment crash-risk and planning-support research system"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Project contributors" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "tzdata>=2025.2,<2028",
]

[project.optional-dependencies]
geo = [
  "geopandas>=1.0,<2",
  "networkx>=3.3,<4",
  "pyarrow>=17,<22",
  "shapely>=2.0,<3",
]
ml = [
  "lightgbm>=4.5,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
]
app = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
qrs = "qld_road_safety.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qld_road_safety"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qld_road_safety"]
